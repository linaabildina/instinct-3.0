name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/alina-daily-chaos-polls]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name instinct-bot --add-data "config;config" --add-data "knowledge;knowledge" launcher.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: instinct-bot-windows
          path: dist/instinct-bot.exe
          if-no-files-found: error
