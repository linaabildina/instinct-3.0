<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Рулетка Инстинкта</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#11101a;--card:#1d1a2b;--text:#fff;--muted:#aaa4bd}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#33205a 0,#11101a 55%);color:var(--text);font-family:Arial,sans-serif;display:flex;justify-content:center}
.wrap{width:min(100%,520px);padding:18px 14px 28px;text-align:center}.title{font-size:28px;font-weight:900;margin:6px 0 4px}.sub{color:var(--muted);font-size:14px;margin-bottom:16px}.wheelbox{position:relative;width:min(92vw,430px);aspect-ratio:1;margin:0 auto 18px}.wheel{width:100%;height:100%;display:block;filter:drop-shadow(0 12px 24px #0008)}.pointer{position:absolute;top:-3px;left:50%;transform:translateX(-50%);z-index:2;font-size:38px;text-shadow:0 3px 5px #000}.center{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;background:#fff;border:7px solid #161321;box-shadow:0 4px 12px #0008;z-index:2}.spin{border:0;border-radius:16px;padding:16px 34px;background:linear-gradient(135deg,#8b5cf6,#ec4899);color:white;font-size:18px;font-weight:900;cursor:pointer;box-shadow:0 8px 20px #0005}.spin:disabled{opacity:.5;cursor:default}.result{display:none;margin-top:18px;padding:18px;border-radius:18px;background:#1d1a2b;border:1px solid #ffffff18}.result .emoji{font-size:48px}.result .name{font-size:22px;font-weight:900;margin:8px 0}.result .hint{color:var(--muted);line-height:1.45;font-size:14px}.notice{display:none;margin:18px 0 0;padding:16px;border-radius:16px;background:#1d1a2b;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="title">🎡 Рулетка Инстинкта</div>
  <div class="sub">Один игрок — одно вращение в сутки</div>
  <div class="wheelbox">
    <div class="pointer">▼</div><canvas id="wheel" class="wheel"></canvas><div class="center"></div>
  </div>
  <button id="spin" class="spin">🎰 КРУТИТЬ</button>
  <div id="notice" class="notice">Сначала получи персональный запуск у Алины. Сейчас открою её чат. 👀</div>
  <div id="result" class="result">
    <div id="emoji" class="emoji"></div><div id="name" class="name"></div>
    <div class="hint">Результат уже отправлен Алине. Жди поздравлений в клане. 😈</div>
  </div>
</div>
<script>
const tg=window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const BOT_USERNAME="instinctbot_bot";
const prizes=[
{id:"check",t:"1 чек",e:"💸"},{id:"yuan",t:"1 юань",e:"🐉"},{id:"zero",t:"0",e:"🕳️"},
{id:"master_dinner",t:"Ужин с Мастером клана",e:"🍖"},{id:"clan_title",t:"Клановый титул",e:"👑"},
{id:"master_10m",t:"Мастер на 10 минут",e:"👑"},{id:"clan_list_title",t:"Титул в клан-листе",e:"📜"},
{id:"vip_person",t:"VIP-персона клана",e:"🏅"},{id:"clan_voice",t:"Голос клана",e:"📢"},
{id:"secret_gift",t:"Секретный подарок",e:"🎁"},{id:"exile_right",t:"Право на изгнание",e:"💀"},
{id:"genius_instinct",t:"Гений Инстинкта",e:"🧠"}];
const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d"),dpr=window.devicePixelRatio||1;
let size=0,angle=0,spinning=false;
function resize(){const rect=canvas.getBoundingClientRect();size=Math.min(rect.width,rect.height);canvas.width=size*dpr;canvas.height=size*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function draw(){const cx=size/2,cy=size/2,r=size/2-5,step=Math.PI*2/prizes.length;ctx.clearRect(0,0,size,size);prizes.forEach((p,i)=>{const a=angle+i*step-Math.PI/2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+step);ctx.closePath();ctx.fillStyle=i%2?"#8b5cf6":"#ec4899";ctx.fill();ctx.strokeStyle="#ffffff44";ctx.stroke();ctx.save();ctx.translate(cx,cy);ctx.rotate(a+step/2);ctx.textAlign="right";ctx.fillStyle="#fff";ctx.font="bold "+Math.max(10,size/34)+"px Arial";ctx.fillText(p.e+" "+(p.t.length>19?p.t.slice(0,18)+"…":p.t),r-10,4);ctx.restore()})}
function decodeToken(token){try{const b64=token.split(".")[0].replace(/-/g,"+").replace(/_/g,"/");const json=decodeURIComponent(atob(b64+"=".repeat((4-b64.length%4)%4)).split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""));return JSON.parse(json)}catch(e){return null}}
function spinTo(index){const step=Math.PI*2/prizes.length,desired=-(index*step+step/2),current=((angle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);let delta=desired-current;if(delta<0)delta+=Math.PI*2;const start=angle,finish=angle+delta+Math.PI*2*(7+Math.floor(Math.random()*3)),duration=6500,started=performance.now();function frame(now){const p=Math.min(1,(now-started)/duration),eased=1-Math.pow(1-p,4);angle=start+(finish-start)*eased;draw();if(p<1){requestAnimationFrame(frame);return}angle=finish;draw();showResult(index)}requestAnimationFrame(frame)}
function showResult(index){const p=prizes[index];document.getElementById("emoji").textContent=p.e;document.getElementById("name").textContent=p.t;document.getElementById("result").style.display="block";document.getElementById("spin").disabled=true;if(tg?.sendData)tg.sendData(JSON.stringify({type:"roulette_spin",token:window.__token}))}
document.getElementById("spin").addEventListener("click",()=>{
 if(spinning)return;
 const payload=decodeToken(window.__token||"");
 if(!payload?.p){
   document.getElementById("notice").style.display="block";
   document.getElementById("spin").disabled=true;
   if(tg?.openTelegramLink) tg.openTelegramLink("https://t.me/"+BOT_USERNAME+"?start=roulette");
   else window.location.href="https://t.me/"+BOT_USERNAME+"?start=roulette";
   return;
 }
 spinning=true;document.getElementById("spin").disabled=true;
 const targetIndex=prizes.findIndex(p=>p.id===payload.p);
 if(targetIndex<0){alert("Приз не найден.");return}
 spinTo(targetIndex);
});
window.__token=new URLSearchParams(location.search).get("token")||tg?.initDataUnsafe?.start_param||"";
window.addEventListener("resize",resize);resize();
</script>
</body>
</html>
