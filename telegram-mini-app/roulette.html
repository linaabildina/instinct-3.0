<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Рулетка гильдии Instinct</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--gold:#d9b45a;--gold2:#ffe9a3;--gold3:#8c6425;--blue:#153653;--blue2:#2d6794;--deep:#05080d;--panel:#091522;--ice:#cfe9ff;--text:#f7efd9}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#03070b}body{min-height:100vh;color:var(--text);font-family:Georgia,"Times New Roman",serif;text-align:center;background:radial-gradient(ellipse at 50% 0,#47799f 0,#234b6b 18%,#0d2235 42%,#04080d 78%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-3;background:radial-gradient(circle at 15% 20%,#fff5cf22 0 1px,transparent 2px),radial-gradient(circle at 72% 12%,#d8edff20 0 1px,transparent 2px),radial-gradient(circle at 88% 55%,#fff0bd18 0 1px,transparent 2px);background-size:97px 113px,131px 151px,157px 179px}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;background:linear-gradient(90deg,transparent 0 8%,#f2cf7210 8.1% 8.25%,transparent 8.4% 91.6%,#f2cf7210 91.75% 91.9%,transparent),linear-gradient(#fff6d908 1px,transparent 1px);background-size:auto,100% 46px;mask-image:linear-gradient(#000,transparent 92%)}
.wrap{width:min(100%,590px);margin:auto;padding:10px 8px 28px}
.frame{position:relative;padding:13px 9px 22px;border:2px solid #a67a32;background:linear-gradient(145deg,#132c43ee,#06111ced 55%,#0b1b2ae8);box-shadow:inset 0 0 0 1px #f5d98744,inset 0 0 55px #75b8e817,0 0 0 5px #07101a,0 0 0 7px #b98c3b55,0 18px 55px #000d;overflow:hidden}
.frame:before,.frame:after{content:"✦";position:absolute;top:4px;color:#ffe9a3;font-size:25px;text-shadow:0 0 12px #ffe9a3}.frame:before{left:8px}.frame:after{right:8px}
.corner{position:absolute;width:30px;height:30px;border-color:#e0bd64;border-style:solid;opacity:.9}.corner.tl{left:-2px;top:-2px;border-width:3px 0 0 3px}.corner.tr{right:-2px;top:-2px;border-width:3px 3px 0 0}.corner.bl{left:-2px;bottom:-2px;border-width:0 0 3px 3px}.corner.br{right:-2px;bottom:-2px;border-width:0 3px 3px 0}
.badge{display:inline-block;padding:5px 16px;border:1px solid #d7ad4e99;background:linear-gradient(#0c2134,#071321);color:#f0d487;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;box-shadow:inset 0 0 12px #78b5dd16,0 2px 7px #0008}
.crest{font-size:25px;margin:7px 0 2px;color:#f2d27b;text-shadow:0 0 15px #9fd9ff88}
.title{font-size:31px;line-height:1.02;font-weight:900;letter-spacing:1px;margin:3px 0;text-transform:uppercase;text-shadow:0 2px 0 #000,0 0 18px #8bc8f755}.title span{color:#e7c265}.subtitle{font-size:12px;color:#a9c5d9;margin:5px 0 7px;letter-spacing:1px}.player{min-height:18px;color:#f4d98a;font-size:13px;font-weight:700;margin-bottom:9px}
.statusbar{display:flex;justify-content:center;gap:6px;margin:0 auto 10px;flex-wrap:wrap}.status{padding:4px 9px;border:1px solid #b58b43;background:#071523cc;color:#bcd4e4;font-size:10px;letter-spacing:.7px}.status b{color:#f4d77f}
.wheelbox{position:relative;width:min(100%,430px);max-width:100%;aspect-ratio:1;margin:0 auto 18px;padding:13px;border-radius:50%;background:radial-gradient(circle,#fff3b1 0 2%,#bd8c32 3% 5%,#091a2a 6% 100%);box-shadow:0 0 0 2px #35230d,0 0 0 4px #e6c76c,0 0 0 7px #173d5c,0 0 0 10px #755421,0 0 0 12px #d8b65c66,0 0 38px #82c7ef66,0 20px 50px #000e}
.wheelbox:before{content:"";position:absolute;inset:2px;border-radius:50%;border:2px solid #f5d98a66;box-shadow:inset 0 0 25px #fff1a044,0 0 10px #000;z-index:3;pointer-events:none}.wheelbox:after{content:"";position:absolute;inset:8px;border-radius:50%;border:1px solid #bfe5ff44;z-index:4;pointer-events:none}
.wheel{width:100%;height:100%;display:block;border-radius:50%;filter:drop-shadow(0 9px 16px #000f)}
.pointer{position:absolute;top:-18px;left:50%;transform:translateX(-50%);z-index:8;font-size:50px;color:#fff0a6;text-shadow:0 3px 0 #3b2509,0 0 20px #fff1a0;line-height:1}
.center{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:82px;height:82px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#fff8cf 0 5%,#e4bd58 11%,#9b6b27 20%,#24577c 38%,#081522 70%);border:4px solid #edcf76;box-shadow:0 0 0 3px #153b59,0 0 0 5px #a77b32,0 0 28px #b9e2ff99,0 6px 18px #000;z-index:5}.center:before{content:"✦";position:absolute;inset:7px;border:1px solid #f5db8b77;border-radius:50%;display:grid;place-items:center;color:#ffe99b;font-size:20px;text-shadow:0 0 10px #fff}.center:after{content:"I";position:absolute;inset:0;display:grid;place-items:center;color:#fff8d0;font-size:27px;font-weight:900;text-shadow:0 0 13px #fff;transform:translateY(1px)}
.controls{width:100%;display:flex;flex-direction:column;align-items:center;gap:9px;padding:0 4px}.spin{position:relative;width:min(100%,360px);min-height:58px;border:2px solid #f7dc87;border-radius:8px;padding:12px 18px;background:linear-gradient(180deg,#ffeaa0 0%,#d5aa4b 38%,#8b5d1e 72%,#b67d27 100%);color:#241606;font-family:Georgia,"Times New Roman",serif;font-size:16px;font-weight:900;letter-spacing:1.2px;cursor:pointer;box-shadow:inset 0 2px 0 #fff8cf,inset 0 -4px 0 #684314,0 3px 0 #2d1b08,0 0 0 2px #62451b,0 0 25px #e0bb5a55;text-shadow:0 1px #fff6;overflow:hidden}.spin:before{content:"";position:absolute;inset:4px;border:1px solid #fff0a855;border-radius:5px;pointer-events:none}.spin:after{content:"✦";margin-left:10px;color:#6c4510}.spin:active:not(:disabled){transform:translateY(2px);box-shadow:inset 0 2px 0 #fff8cf,inset 0 -2px 0 #684314,0 1px 0 #2d1b08,0 0 0 2px #62451b}.spin:disabled{opacity:.72;cursor:default;filter:saturate(.7)}
.cooldown{font-size:11px;color:#9fb7c8;min-height:18px}.cooldown b{color:#f1d47e}.notice{display:none;margin:15px 3px 0;padding:12px;border:1px solid #d7ad4e66;background:#081522;color:#c9d9e4;line-height:1.5}
.modal{display:none;position:fixed;inset:0;background:#02060de6;z-index:20;align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(6px)}.modal.show{display:flex}
.card{position:relative;width:min(100%,440px);padding:29px 21px 23px;background:linear-gradient(145deg,#1b3d5b,#091622 55%,#07101a);border:2px solid #e0bd61;box-shadow:inset 0 0 0 1px #fff0a544,0 0 0 5px #102a42,0 0 0 7px #936d2c66,0 0 50px #8ac8ff55,0 22px 70px #000;border-radius:3px}.card:before{content:"✦  ✦  ✦";display:block;color:#e9cc78;letter-spacing:9px;margin-bottom:10px}.card:after{content:"";position:absolute;inset:7px;border:1px solid #dcb75e33;pointer-events:none}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}.card{animation:pop .45s ease-out}.card .big{font-size:62px;filter:drop-shadow(0 0 15px #fff0a0)}.card h2{margin:8px 0;color:#ffe29a;font-size:24px;text-transform:uppercase;text-shadow:0 0 14px #d5aa4c}.card .tag{display:inline-block;margin:4px 0 12px;padding:4px 11px;border:1px solid #cba64e88;background:#071321;color:#e7ce87;font-size:10px;letter-spacing:2px}.card p{color:#d4e0e7;line-height:1.55;margin:8px 0 18px}.ok{border:1px solid #ffe5a0;background:linear-gradient(#e3c66c,#95661e);color:#1d1306;padding:11px 30px;border-radius:2px;font-weight:900;cursor:pointer;box-shadow:0 2px 0 #3c250b}
.shake{animation:shake .12s linear 4}@keyframes shake{50%{transform:translate(3px,-2px)}}.spark{position:fixed;width:5px;height:5px;background:#ffe89a;box-shadow:0 0 10px #fff;z-index:30;pointer-events:none;animation:spark 1s ease-out forwards}@keyframes spark{to{transform:translate(var(--x),var(--y)) scale(.1);opacity:0}}
@media(max-width:380px){.wrap{padding-left:5px;padding-right:5px}.frame{padding-left:6px;padding-right:6px}.title{font-size:25px}.wheelbox{width:100%;padding:10px}.center{width:66px;height:66px}.spin{width:100%;max-width:340px;font-size:14px;padding:12px 12px;min-height:54px}.card h2{font-size:20px}}
</style>
</head>
<body>
<div class="wrap"><div class="frame"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
<div class="badge">Perfect World • Guild Instinct</div>
<div class="crest">⚔ ✦ 🐉 ✦ ⚔</div>
<div class="title">Рулетка гильдии <span>Instinct</span></div>
<div class="subtitle">Ежедневная судьба гильдии</div>
<div id="player" class="player"></div><div class="statusbar"><div class="status">🎡 <b>1</b> вращение / 24 часа</div><div class="status">⚔ <b>Instinct</b> • PW</div></div>
<div class="wheelbox"><div class="pointer">▼</div><canvas id="wheel" class="wheel"></canvas><div class="center"></div></div>
<div class="controls"><button id="spin" class="spin">⚔ КРУТИТЬ РУЛЕТКУ ⚔</button><div id="cooldown" class="cooldown"></div></div>
<div id="notice" class="notice"></div>
</div></div>
<div id="modal" class="modal"><div class="card"><div id="modalEmoji" class="big"></div><div id="modalTag" class="tag">НАГРАДА</div><h2 id="modalName"></h2><p id="modalText"></p><button class="ok" id="modalOk">ЗАБРАТЬ НАГРАДУ</button></div></div>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const BOT_USERNAME="instinctbot_bot";
const prizes=[
{id:"empty_gift",t:"Пустой подарок",e:"🎁"},
{id:"golden_air",t:"Золотой воздух",e:"💨"},
{id:"good_person_certificate",t:"Справка «Я сегодня молодец»",e:"📜"},
{id:"alina_question_coupon",t:"Купон на вопрос Алине",e:"🎟️"},
{id:"legendary_potato",t:"Легендарная картошка Инстинкта",e:"🥔"},
{id:"lucky_sock",t:"Носок абсолютной удачи",e:"🧦"},
{id:"useless_power_crystal",t:"Кристалл бесполезной мощи",e:"💎"},
{id:"busy_wand",t:"Палочка «Сделай вид, что я занят»",e:"🪄"},
{id:"audacity_license",t:"Лицензия на наглость",e:"🪪"},
{id:"alina_eye",t:"Око Алины",e:"👀"},
{id:"dragon_scale",t:"Чешуя Дракона",e:"🐉"},
{id:"favorite_crown",t:"Корона главного любимчика",e:"👑"},
{id:"alina_brain",t:"Мозг Алины на прокат",e:"🧠"}
];
const texts={
empty_gift:"Внутри ничего нет. Алина уверяет, что это очень редкий предмет. 😂",
golden_air:"Золотой воздух. Дышать можно как обычно. Но он золотой. ✨",
good_person_certificate:"Официальная справка от Алины: ты сегодня молодец. Оснований нет. Но Алина решила. 😌",
alina_question_coupon:"Один бесплатный вопрос Алине. Да, спрашивать можно было и без него. Но теперь это официально. 😂",
legendary_potato:"Легендарный артефакт неизвестного назначения. Никто не знает, зачем она нужна. Но Алина говорит, что это очень важно.",
lucky_sock:"Носок приносит абсолютную удачу. Второго носка не существует. В этом и заключается его сила.",
useless_power_crystal:"+999 к понтам и +0 к характеристикам. Редкий, красивый и совершенно бесполезный.",
busy_wand:"Позволяет убедительно выглядеть занятым, ничего не делая. Алина официально одобряет.",
audacity_license:"Разрешает быть наглым целых 24 часа. Алина постарается не осуждать. 😈",
alina_eye:"Алина теперь знает, что ты опять ничего не делаешь. Скрыться невозможно. 😈",
dragon_scale:"Защищает от критики, здравого смысла и некоторых сомнительных решений. Научно не подтверждено.",
favorite_crown:"На 24 часа ты официально главный любимчик Алины. Остальным разрешается завидовать.",
alina_brain:"Легендарный предмет! Алина временно передала тебе 0,5% своего мозга на 24 часа. Вернуть желательно. 😂"
};
const canvas=document.getElementById("wheel"),ctx=canvas.getContext("2d"),dpr=devicePixelRatio||1;let size=0,angle=0,spinning=false;
function resize(){const r=canvas.getBoundingClientRect();size=Math.min(r.width,r.height);canvas.width=size*dpr;canvas.height=size*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function draw(){const cx=size/2,cy=size/2,r=size/2-7,step=Math.PI*2/prizes.length;ctx.clearRect(0,0,size,size);prizes.forEach((p,i)=>{const a=angle+i*step-Math.PI/2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a,a+step);ctx.closePath();const g=ctx.createLinearGradient(cx+Math.cos(a)*r,cy+Math.sin(a)*r,cx,cy);g.addColorStop(0,i%2?"#315f87":"#19466e");g.addColorStop(.5,i%2?"#427ba4":"#28658f");g.addColorStop(1,i%2?"#152f4a":"#0d2842");ctx.fillStyle=g;ctx.fill();ctx.strokeStyle="#e5c46b99";ctx.lineWidth=1.4;ctx.stroke();ctx.save();ctx.translate(cx,cy);ctx.rotate(a+step/2);ctx.textAlign="right";ctx.fillStyle="#fff1be";ctx.shadowColor="#000";ctx.shadowBlur=5;ctx.font="bold "+Math.max(10,size/35)+"px Georgia";ctx.fillText(p.e+" "+(p.t.length>18?p.t.slice(0,17)+"…":p.t),r-12,4);ctx.restore()});ctx.beginPath();ctx.arc(cx,cy,r-1,0,Math.PI*2);ctx.strokeStyle="#f5d97c";ctx.lineWidth=3;ctx.stroke()}
function decodeToken(token){try{const b=token.split(".")[0].replace(/-/g,"+").replace(/_/g,"/"),j=decodeURIComponent(atob(b+"=".repeat((4-b.length%4)%4)).split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""));return JSON.parse(j)}catch(e){return null}}
function todayKey(){const d=new Date(Date.now()+5*3600000);return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")}
function userKey(){return tg?.initDataUnsafe?.user?.id||"unknown"}
function spinStorageKey(){return "roulette_last_spin_"+userKey()}
function lastSpinAt(){try{const v=Number(localStorage.getItem(spinStorageKey())||0);return Number.isFinite(v)?v:0}catch(e){return 0}}
function countdown(){
  if(spinning)return;
  const last=lastSpinAt(),ms=Math.max(0,last+24*3600000-Date.now());
  if(!last){document.getElementById("cooldown").textContent="Готово к вращению";return}
  if(ms<=0){
    document.getElementById("cooldown").innerHTML="🎡 <b>Вращение доступно!</b>";
    document.getElementById("spin").disabled=false;
    document.getElementById("spin").textContent="⚔ КРУТИТЬ РУЛЕТКУ ⚔";
    return
  }
  const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);
  document.getElementById("cooldown").innerHTML="Следующее вращение через: <b>"+String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"</b>";
}
function lockIfAlreadySpun(){if(lastSpinAt()+24*3600000>Date.now())lock()}
function lock(){
  const b=document.getElementById("spin");b.disabled=true;b.textContent="🔒 ВРАЩЕНИЕ ИСПОЛЬЗОВАНО";
  document.getElementById("notice").textContent="Ограничение хранится на сервере: обновление страницы или очистка браузера не даст новую прокрутку.";
  document.getElementById("notice").style.display="block"
}
function markSpun(){try{localStorage.setItem(spinStorageKey(),String(Date.now()))}catch(e){}}
function sparks(){for(let i=0;i<28;i++){const s=document.createElement("i");s.className="spark";s.style.left="50%";s.style.top="50%";s.style.setProperty("--x",(Math.random()*360-180)+"px");s.style.setProperty("--y",(Math.random()*360-180)+"px");document.body.appendChild(s);setTimeout(()=>s.remove(),1100)}}
function special(index){
  const id=prizes[index].id;
  if(id==="empty_gift")document.querySelector(".wheelbox").classList.add("shake");
  else sparks();
  const rare=["favorite_crown","alina_brain","dragon_scale"];
  document.getElementById("modalTag").textContent=rare.includes(id)?"ЛЕГЕНДАРНАЯ НАГРАДА":"ПОДАРОК ОТ АЛИНЫ";
  try{tg?.HapticFeedback?.notificationOccurred(rare.includes(id)?"success":"success")}catch(_){}
}
function showResult(index){
  const p=prizes[index];
  markSpun();
  special(index);
  document.getElementById("modalEmoji").textContent=p.e;
  document.getElementById("modalName").textContent=p.t;
  document.getElementById("modalText").textContent=texts[p.id]||"";
  document.getElementById("modal").classList.add("show");
  document.getElementById("spin").disabled=true;
  document.getElementById("spin").textContent="🔒 ВРАЩЕНИЕ ИСПОЛЬЗОВАНО";
  if(tg?.sendData)tg.sendData(JSON.stringify({type:"roulette_spin",token:window.__token}));
}
function spinTo(index){
  const step=Math.PI*2/prizes.length,desired=-(index*step+step/2),current=((angle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  let delta=desired-current;if(delta<0)delta+=Math.PI*2;
  const start=angle,finish=angle+delta+Math.PI*2*(6+Math.floor(Math.random()*3)),duration=5000,started=performance.now();
  const phrases=["👀 Так-так... что же тебе выпадет?","🎲 Алина думает...","😈 Я уже вижу твой приз...","🔮 Судьба решается...","🤨 Подозрительно..."];
  let phraseIndex=0;
  const phraseTimer=setInterval(()=>{document.getElementById("cooldown").textContent=phrases[phraseIndex++%phrases.length]},650);
  try{tg?.HapticFeedback?.impactOccurred("medium")}catch(_){}
  function frame(now){
    const p=Math.min(1,(now-started)/duration),e=1-Math.pow(1-p,5);
    angle=start+(finish-start)*e;draw();
    if(p<1){requestAnimationFrame(frame);return}
    clearInterval(phraseTimer);
    angle=finish;draw();showResult(index)
  }
  requestAnimationFrame(frame)
}
document.getElementById("modalOk").onclick=()=>document.getElementById("modal").classList.remove("show");
document.getElementById("spin").addEventListener("click",()=>{if(spinning)return;const payload=decodeToken(window.__token||"");if(!payload?.p){document.getElementById("notice").textContent="Сначала получи персональный запуск у Алины.";document.getElementById("notice").style.display="block";if(tg?.openTelegramLink)tg.openTelegramLink("https://t.me/"+BOT_USERNAME+"?start=roulette");else location.href="https://t.me/"+BOT_USERNAME+"?start=roulette";return}const targetIndex=prizes.findIndex(p=>p.id===payload.p);if(targetIndex<0){alert("Приз не найден.");return}spinning=true;document.getElementById("spin").disabled=true;spinTo(targetIndex)});
window.__token=new URLSearchParams(location.search).get("token")||tg?.initDataUnsafe?.start_param||"";const u=tg?.initDataUnsafe?.user;if(u)document.getElementById("player").textContent="Игрок: "+(u.first_name||u.username||"герой");window.addEventListener("resize",resize);resize();lockIfAlreadySpun();countdown();setInterval(countdown,1000);
</script>
</body>
</html>
