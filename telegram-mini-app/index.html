<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#11101a">
  <title>Рулетка Инстинкта</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body style="margin:0;background:#11101a;color:#fff">
<script>
(function(){
  const tg=window.Telegram&&window.Telegram.WebApp;
  if(tg){tg.ready();tg.expand();try{tg.setHeaderColor("#11101a");tg.setBackgroundColor("#11101a")}catch(_){}}
  window.location.replace("./roulette.html"+window.location.search);
})();
</script>
</body>
</html>
