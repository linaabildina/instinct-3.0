<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#11101a">
  <title>Рулетка Инстинкта</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11101a}
    #app{width:100%;height:100%;border:0;display:block}
  </style>
</head>
<body>
  <iframe id="app" title="Рулетка Инстинкта"
    src="./roulette.html"
    allow="autoplay"
    referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <script>
    (function(){
      const tg=window.Telegram&&window.Telegram.WebApp;
      if(!tg)return;
      tg.ready();tg.expand();
      try{tg.setHeaderColor("#11101a");tg.setBackgroundColor("#11101a")}catch(_){}
    })();
  </script>
</body>
</html>
